[project]
name = "gait-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.0",
    "pydantic>=2.12.5",
    "scipy>=1.17.0",
    "seaborn>=0.13.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.ruff]
# Exclude E402 (module level import not at top) for scripts
# Scripts need sys.path.insert before importing project modules
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
